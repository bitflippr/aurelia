<style>

:absolute;inset:10px 16px;border:1px solid #d4e1e888;border-radius:100%;transform:rotate(35deg);box-shadow:6px 0 0 #c5d3dc33}.track b{display:block;font-weight:500;font-size:14px}.track small{display:block;color:#aaa0b6;margin-top:3px;font-size:12px}.dots{margin-left:auto;color:#b6a6c3;letter-spacing:1px}.study{margin:31px 0 32px}.study h3{font-size:22px;font-weight:590;letter-spacing:-.35px;margin:0 0 20px}.rows{display:flex;flex-direction:column;gap:9px}.genre-row{display:flex;gap:8px;width:100%}.genre{border:1px solid #46414c;border-radius:14px;background:#1b1a20;display:flex;align-items:center;justify-content:center;min-width:0;min-height:48px;padding:0 9px;position:relative}.genre span{white-space:nowrap;display:block;line-height:1.1;font-family:Flex,sans-serif;letter-spacing:0;font-variation-settings:'wdth' var(--width,100),'wght' var(--weight,500),'ROND' 100,'opsz' 24}.genre[aria-pressed=true]{background:#dac0ed!important;color:#302039!important;border-color:#dac0ed!important}.B .genre{min-height:61px;border-radius:17px;border-color:#41344c;background:#231c2b}.B .genre:nth-child(even){background:#1d1923}.B .genre-row:nth-child(2) .genre{border-radius:14px 14px 18px 18px}.C .rows{gap:7px}.C .genre-row{gap:2px;border-radius:18px;overflow:hidden}.C .genre{min-height:58px;border:0;border-radius:0;background:#27212e}.C .genre:nth-child(even){background:#312638}.C .genre span{letter-spacing:-.15px}.current{display:flex;flex-wrap:wrap;gap:10px 8px}.current .genre{flex:none;min-height:43px;padding:0 15px;font-size:16px}.current .genre span{font-variation-settings:'wdth' 100,'wght' 450,'ROND' 100}
.bottom{padding:0 12px;background:#0e0e11}.mini{height:62px;padding:9px 12px;display:flex;gap:10px;align-items:center;border-radius:20px;background:#352a41}.mini .cover{height:40px;width:40px;border-radius:50%}.mini .now{flex:1;min-width:0}.mini b{font-size:12px;display:block;font-weight:560;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.mini small{font-size:10px;color:#c7b5d5}.transport{border:0;border-radius:50%;background:#ddbcf6;color:#3a224c;width:34px;height:34px;display:grid;place-items:center;padding:8px}.transport svg{width:18px;height:18px;fill:currentColor}.nav{display:flex;justify-content:space-around;padding:18px 4px 10px}.nav div{display:flex;align-items:center;flex-direction:column;gap:6px;color:#a99bb4;font-size:10px;min-width:70px}.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav .active{color:#eedcf9}.nav .active svg{background:#37253f;padding:3px 17px;box-sizing:content-box;border-radius:20px;margin:-3px -17px}.gesture{height:4px;width:103px;background:#ddd7e4;border-radius:3px;margin:8px auto 9px}.caption{padding:17px 4px 0;min-height:70px;font-size:13px;line-height:1.6}.caption b{color:#e3d6ee;font-weight:550}.readout{margin:13px 4px 0;color:#94869f;font-size:11px;min-height:30px}.switcher{position:fixed;bottom:19px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#efdefa;color:#32203d;padding:7px;border-radius:28px;box-shadow:0 8px 32px #0009;z-index:5}.switcher button{width:36px;height:36px;border-radius:50%;border:0;background:#dcc9e8;color:#32203d}.switcher span{font-size:13px;min-width:171px;text-align:center}.sample-note{font-size:11px;color:#766a82;text-align:center;margin:20px 0 0}.measure{position:fixed;left:-10000px;top:0;white-space:nowrap;visibility:hidden;pointer-events:none}.toast{font-size:11px;color:#d9bce9;height:20px;margin:0 0 9px;opacity:0}.toast.show{opacity:1} @media(max-width:600px){.workspace{padding:24px 14px 105px}.mast{display:block;margin-bottom:23px}h1{font-size:27px}.mast p{font-size:13px}.tools{margin-top:18px;justify-content:flex-start;gap:8px}.tool{font-size:12px;padding:9px 13px}.slider{display:none}.boards:not(.compare) .board{width:100%}.phone{border-radius:23px}.app{padding-left:17px;padding-right:17px}.study h3{font-size:21px}.status{padding-top:12px;padding-bottom:10px}.boards.compare .board{width:360px}.caption{min-height:0}.switcher{bottom:12px}.sample-note{margin-top:14px}}@media(prefers-reduced-motion:no-preference){.genre{transition:background .18s,color .18s}.board{animation:in .18s ease-out}@keyframes in{from{opacity:.45}to{opacity:1}}}
@media(max-width:360px){.genre-row{gap:6px}.genre{padding-inline:6px}.B .genre{min-height:56px}.C .genre-row{gap:2px}}
.experiment{display:flex;gap:14px;align-items:center;justify-content:center;margin:-5px 0 27px;flex-wrap:wrap}.experiment label{display:flex;align-items:center;gap:10px;color:#c0b2cc;font-size:12px}.experiment select{font:inherit;background:#27232e;color:#e9e3ef;border:1px solid #45404c;border-radius:15px;padding:10px 12px}.experiment input{width:100px;accent-color:#d7b5ed}.sample-note a{color:#b3a0c0;text-underline-offset:3px}.B .genre{min-height:57px}.B .genre-row:nth-child(2) .genre{border-radius:17px}.B .readout{font-variant-numeric:tabular-nums}@media(max-width:600px){.mast{margin-bottom:18px}.experiment{justify-content:flex-start;gap:10px;margin-bottom:22px}.experiment .type-control{width:100%}.experiment input{flex:1;max-width:210px}.boards:not(.compare) .board{width:min(100%,var(--phone-width,414px))}.boards{justify-content:center}.mast h1{font-size:25px}}
</style>
</head><body>
<main class="workspace"><header class="mast"><div><div class="kicker">Aurelia / type study</div><h1>Let the words shape the rows.</h1><p>Change the labels or text size. The rows find their own fit.</p></div><div class="tools"><label class="slider">Phone width <input type="range" id="width" min="320" max="460" value="414" aria-label="Phone width"><output id="widthValue">414</output></label><button class="tool" id="original" aria-pressed="false">Show current</button><button class="tool" id="compare">Compare three</button></div></header><div class="experiment"><label>Genres <select id="dataset"><option value="original">Your eight genres</option><option value="more">A larger collection</option><option value="long">Longer genre names</option></select></label><button class="tool" id="mixOrder">Mix the order</button><label class="type-control">Type size <input type="range" id="typeSize" min="18" max="28" value="23" aria-label="Type size"><output id="typeValue">23</output></label></div><div id="boards" class="boards"></div><p class="sample-note">Inspired by <a href="https://flickr.github.io/justified-layout/" target="_blank" rel="noreferrer">Flickr’s justified rows</a>, <a href="https://djr.com/fit/" target="_blank" rel="noreferrer">DJR’s Fit specimen</a>, and <a href="https://github.com/Lorp/fit-to-width" target="_blank" rel="noreferrer">fit-to-width</a>.<br>Mockup only · tapping a genre previews selection; no audio plays.</p></main>
<nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous design">←</button><span id="variantLabel"></span><button id="next" aria-label="Next design">→</button></nav>
<script>
const originalNames=['Electronic','Chiptune','Hip Hop','Pop','Ambient','Digicore','Orchestral','Dance'];
let names=[...originalNames],typeSize=23;
const datasets={original:originalNames,more:[...originalNames,'Drum & Bass','Post Rock','Jazz','Synthwave'],long:['Alternative Hip Hop','Progressive Electronic','Contemporary Classical','Drum & Bass','Experimental Pop','Post Rock','Ambient Techno','Neo Soul']};
const variants={A:{name:'Quietly fitted',sub:'Even rhythm. Two clean edges.',description:'<b>The subtle option.</b> One text size, gently adjusted widths. Both rows fill the available space.',sizes:[19,19,19,19,19,19,19,19],weights:[510,510,510,510,510,510,510,510]},B:{name:'Dynamic, fitted rows',sub:'Natural widths. A different fit for every screen.',description:'<b>The labels decide the layout.</b> Row breaks and chip widths are calculated together. Every row fills the space, with gentle typography adjustments after fitting.',sizes:[23,23,23,23,23,23,23,23],weights:[500,650,750,550,500,650,750,550]},C:{name:'Genre strips',sub:'Two continuous bands of type.',description:'<b>The graphic option.</b> Joined tiles make the two-row shape feel like a single unit, with contrasting type inside.',sizes:[22,21,22,24,22,23,21,24],weights:[780,420,780,430,430,800,440,800]}};
const keys=Object.keys(variants);let variant=new URL(location.href).searchParams.get('variant')||'B';if(![...keys,'all'].includes(variant))variant='B';let showOriginal=false,selected=null,phoneWidth=414,fontsReady=false;
const nav=`<nav class="nav" aria-label="Mock navigation"><div class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</div><div><svg viewBox="0 0 24 24"><path d="M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0"/></svg>Search</div><div><svg viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 4l6 15"/></svg>Library</div></nav>`;
function chip(name,i){return `<button class="genre" data-genre="${i}" aria-pressed="${selected===i}"><span>${name}</span></button>`}
function board(k){const v=variants[k],rows=Array.from({length:Math.ceil(names.length/4)},(_,r)=>names.slice(r*4,(r+1)*4));return `<article class="board ${k}" data-variant="${k}" style="--phone-width:${phoneWidth}px"><header class="board-head"><span class="letter">${k}</span><div><h2>${v.name}</h2><p>${v.sub}</p></div></header><div class="phone"><div class="status"><span>9:41</span><span>▴ ≋ ▰</span></div><div class="app"><div class="context-header"><h3>Worth another listen</h3><small>See all →</small></div><div class="track"><div class="cover"></div><div><b>A Walk</b><small>Tycho · Dive</small></div><span class="dots">•••</span></div><section class="study"><h3>A little of everything</h3><div class="${showOriginal?'current':'rows'}">${showOriginal?names.map(chip).join(''):rows.map(row=>`<div class="genre-row">${row.map(n=>chip(n,names.indexOf(n))).join('')}</div>`).join('')}</div></section><div class="toast" role="status"></div></div><div class="bottom"><div class="mini"><div class="cover"></div><div class="now"><b>${selected===null?'A Walk':names[selected]+' mix'}</b><small>${selected===null?'Tycho':'Selection preview'}</small></div><button class="transport" aria-label="Preview play or pause"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button></div>${nav}<div class="gesture"></div></div></div><p class="caption">${showOriginal?'<b>Current treatment.</b> Fixed text widths wrap naturally, leaving an extra partial row.':v.description}</p><p class="readout" aria-live="polite"></p></article>`}
const probe=document.createElement('span');probe.className='measure';document.body.append(probe);
const measurements=new Map();
function measure(text,size,weight,width){const key=[text,size,weight,width].join('|');if(fontsReady&&measurements.has(key))return measurements.get(key);probe.textContent=text;probe.style.fontSize=size+'px';probe.style.fontVariationSettings=`'wdth' ${width},'wght' ${weight},'ROND' 100,'opsz' 24`;const result=probe.getBoundingClientRect().width;if(fontsReady)measurements.set(key,result);return result}
function genreWeight(name){
  const hash=[...name].reduce((n,c)=>n+c.charCodeAt(0),0);
  return [500,580,660,740][hash%4];
}
function justifiedRows(width,gap,padding){
  const natural=names.map(name=>measure(name,typeSize,genreWeight(name),100)+padding);
  const minimum=names.map(name=>measure(name,16,genreWeight(name),72)+padding);
  const best=Array(names.length+1).fill(null);best[0]={cost:0,rows:[]};
  // Choose all line breaks together, so a greedy first row cannot leave an
  // isolated short label stretching across the final row.
  for(let end=1;end<=names.length;end++){
    for(let start=0;start<end;start++){
      if(!best[start])continue;
      const count=end-start,available=width-gap*(count-1);
      if(available<=0)continue;
      const widths=natural.slice(start,end),ratio=available/widths.reduce((a,n)=>a+n,0);
      if(widths.some((w,j)=>w*ratio<minimum[start+j]))continue;
      const compression=Math.log(ratio);
      let cost=.065+compression*compression*(ratio<1?3:2);
      if(ratio<.72)cost+=25*Math.pow(.72-ratio,2);
      if(ratio>1.5)cost+=12*Math.pow(ratio-1.5,2);
      if(count===1&&names.length>1)cost+=.5;
      const candidate=best[start].cost+cost;
      if(!best[end]||candidate<best[end].cost){
        best[end]={cost:candidate,rows:[...best[start].rows,{start,end,ratio,widths:widths.map(n=>n*ratio)}]};
      }
    }
  }
  return best[names.length]?.rows||[];
}
function fit(){
  if(!fontsReady)return;
  document.querySelectorAll('.board').forEach(b=>{
    const v=variants[b.dataset.variant],dynamic=b.dataset.variant==='B';
    if(showOriginal){b.querySelector('.readout').textContent='Current · naturally wrapping labels';return}
    const container=b.querySelector('.rows'),probeChip=b.querySelector('.genre'),probeRow=b.querySelector('.genre-row');
    const cs=getComputedStyle(probeChip),gap=parseFloat(getComputedStyle(probeRow).gap);
    const padding=2*(parseFloat(cs.paddingLeft)+parseFloat(cs.borderLeftWidth))+1;
    const plan=dynamic?justifiedRows(container.clientWidth,gap,padding):null;
    if(plan){
      const signature=plan.map(row=>row.start+':'+row.end).join('|');
      if(container.dataset.packing!==signature){
        container.innerHTML=plan.map(row=>'<div class="genre-row">'+names.slice(row.start,row.end).map((name,j)=>chip(name,row.start+j)).join('')+'</div>').join('');
        container.dataset.packing=signature;
      }
    }
    const axes=[];
    b.querySelectorAll('.genre-row').forEach((row,r)=>{
      const chips=[...row.children],available=row.clientWidth-gap*(chips.length-1);
      const natural=chips.map(c=>{const i=+c.dataset.genre;return measure(names[i],v.sizes[i%v.sizes.length],v.weights[i%v.weights.length],100)+padding});
      const shares=natural.map(n=>b.dataset.variant==='C'?1:n),sum=shares.reduce((a,x)=>a+x,0);
      chips.forEach((c,j)=>{
        const i=+c.dataset.genre,cell=plan?plan[r].widths[j]:available*shares[j]/sum,room=cell-padding;
        c.style.flex='0 0 '+cell+'px';
        const text=c.firstElementChild,weight=dynamic?genreWeight(names[i]):v.weights[i%v.weights.length];
        let size=dynamic?Math.max(16,typeSize*Math.max(.88,Math.min(1.12,Math.sqrt(plan[r].ratio)))):v.sizes[i%v.sizes.length];
        let lo=dynamic?72:25,hi=dynamic?138:151;
        const minimumSize=dynamic?16:13;
        while(measure(names[i],size,weight,lo)>room&&size>minimumSize)size=Math.max(minimumSize,size-.25);
        for(let n=0;n<12;n++){
          const mid=(lo+hi)/2;
          if(measure(names[i],size,weight,mid)>room)hi=mid;else lo=mid;
        }
        text.style.fontSize=size+'px';text.style.flex='none';text.style.transform='none';
        text.style.setProperty('--weight',weight);text.style.setProperty('--width',lo.toFixed(2));
        axes.push(lo);
      });
    });
    const pattern=[...b.querySelectorAll('.genre-row')].map(row=>row.children.length).join(' / ');
    b.querySelector('.readout').textContent=pattern+' · '+names.length+' genres · every row fitted to '+container.clientWidth+'px';
  });
  console.info('Genre prototype',{variant,showOriginal,selected:selected===null?null:names[selected],phoneWidth,typeSize,fontsReady});
}
function render(){document.getElementById('boards').className='boards'+(variant==='all'?' compare':'');document.getElementById('boards').innerHTML=(variant==='all'?keys:[variant]).map(board).join('');document.getElementById('variantLabel').textContent=variant==='all'?'A / B / C · Compare':variant+' · '+variants[variant].name;document.getElementById('compare').textContent=variant==='all'?'Focus on B':'Compare three';document.getElementById('original').setAttribute('aria-pressed',showOriginal);document.getElementById('original').textContent=showOriginal?'Show fitted chips':'Show current';fit()}
function choose(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
function cycle(d){choose(keys[(Math.max(0,keys.indexOf(variant))+d+keys.length)%keys.length])}
document.getElementById('previous').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('compare').onclick=()=>choose(variant==='all'?'B':'all');document.getElementById('original').onclick=()=>{showOriginal=!showOriginal;render()};document.getElementById('width').oninput=e=>{phoneWidth=+e.target.value;document.getElementById('widthValue').value=phoneWidth;document.querySelectorAll('.board').forEach(b=>b.style.setProperty('--phone-width',phoneWidth+'px'));fit()};
document.getElementById('dataset').onchange=e=>{names=[...datasets[e.target.value]];selected=null;choose('B')};
document.getElementById('mixOrder').onclick=()=>{const selectedName=names[selected];for(let i=names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]]}selected=selectedName?names.indexOf(selectedName):null;choose('B')};
document.getElementById('typeSize').oninput=e=>{typeSize=+e.target.value;document.getElementById('typeValue').value=typeSize;if(variant!=='B')choose('B');else fit()};
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
document.getElementById('boards').onclick=e=>{const chip=e.target.closest('[data-genre]');if(chip){selected=+chip.dataset.genre;document.querySelectorAll('[data-genre]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.genre===selected));document.querySelectorAll('.now').forEach(n=>n.innerHTML=`<b>${names[selected]} mix</b><small>Selection preview</small>`);console.info('Genre selected',names[selected])}const play=e.target.closest('.transport');if(play){const paused=play.dataset.playing==='true';play.dataset.playing=String(!paused);play.innerHTML=`<svg viewBox="0 0 24 24"><path d="${paused?'M8 5v14l11-7z':'M7 5h4v14H7zM14 5h4v14h-4z'}"/></svg>`}};
render();document.fonts.load('500 20px Flex').then(()=>document.fonts.ready).then(()=>{fontsReady=true;fit()});new ResizeObserver(()=>fit()).observe(document.getElementById('boards'));
</script></body></html>
