<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aurelia · Home studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141318;color:#f2edf5;font:15px system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #efc6ff;outline-offset:4px}button{ -webkit-tap-highlight-color:transparent}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}button:hover{filter:brightness(1.12)}.workspace{max-width:1480px;margin:auto;padding:42px 40px 115px}.mast{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;gap:20px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#b1a0bd;font-weight:650}h1{font-weight:500;font-size:30px;letter-spacing:-1px;margin:9px 0}.mast p{color:#aca4b3;font-size:14px;line-height:1.6;margin:0}.compare{background:#2d2735;border:1px solid #4c4158;padding:12px 18px;border-radius:24px;white-space:nowrap}.boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}.boards.single{grid-template-columns:minmax(0,420px);justify-content:center}.board>header{display:flex;gap:12px;align-items:center;margin-bottom:16px}.letter{border:1px solid #4c4158;border-radius:12px;padding:9px 13px;color:#d9b8f1}.board h2{font-size:17px;font-weight:550;margin:0 0 4px}.board header p{font-size:12px;color:#a89daf;margin:0}.phone{position:relative;border:1px solid #514858;border-radius:38px;background:#151218;height:872px;overflow:hidden;box-shadow:0 18px 70px #0004}.status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 25px;font-size:12px;font-weight:650;position:relative;z-index:2;background:#151218}.camera{position:absolute;left:calc(50% - 6px);width:12px;height:12px;background:#060508;border-radius:50%}.status span:last-child{font-size:11px;letter-spacing:2px}.scroll{height:calc(100% - 40px);overflow:auto;scrollbar-width:none;padding:14px 20px 168px}.apphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.apphead h3{font-size:28px;letter-spacing:-.8px;font-weight:600;margin:4px 0}.subtle{font-size:12px;color:#a99dae}.avatar{border-radius:50%;background:#40314f;color:#e4c2fc;width:36px;height:36px;display:grid;place-items:center;font-size:13px}.section{display:flex;align-items:center;justify-content:space-between;margin:27px 0 14px}.section h4{font-size:19px;font-weight:600;letter-spacing:-.4px;margin:0}.section button{background:none;color:#c9addd;font-size:12px;padding:6px 0 6px 10px}.art{position:relative;display:block;aspect-ratio:1;border-radius:18px;overflow:hidden;isolation:isolate;background:var(--bg);color:var(--ink)}.art:before{content:'';position:absolute;inset:13% 19%;border:1px solid currentColor;border-radius:50%;transform:rotate(-35deg);box-shadow:12px 8px 0 -1px var(--bg),13px 8px 0 currentColor,26px 16px 0 -1px var(--bg),27px 16px 0 currentColor;opacity:.55}.art:after{content:attr(data-word);position:absolute;bottom:12%;left:11%;right:9%;font-family:Georgia,serif;font-size:clamp(18px,3vw,33px);letter-spacing:-1px;line-height:1}.art.i1:before{border-radius:2px;inset:15% 31%;transform:rotate(30deg);box-shadow:14px 10px 0 -1px var(--bg),15px 10px 0 currentColor}.art.i2:before{border-radius:50% 50% 0 0;inset:12% 24%;transform:rotate(0deg);background:linear-gradient(180deg,transparent,#f5b97f66);box-shadow:none}.art.i3:before{border-radius:0;inset:0 35%;transform:rotate(30deg);background:currentColor;opacity:.2;box-shadow:35px 0 currentColor,-35px 0 currentColor}.art.i4:before{inset:15%;border-radius:50%;border-width:18px;box-shadow:0 0 0 1px currentColor,0 0 0 10px var(--bg),0 0 0 11px currentColor}.art.i5:before{inset:20%;transform:rotate(45deg);border-radius:0;box-shadow:10px 10px 0 -1px var(--bg),11px 11px 0 currentColor}.hero{position:relative;border-radius:25px;overflow:hidden;background:#31212b}.hero>.art{border-radius:0;aspect-ratio:1.04}.hero>.art:after{font-size:55px;bottom:25%}.herofoot{position:relative;margin-top:-62px;background:linear-gradient(transparent,#271c27 58%);padding:34px 18px 20px;display:flex;justify-content:space-between;align-items:end}.herofoot h4{font-size:25px;margin:6px 0}.herofoot p{margin:0;font-size:12px;color:#cfbdce}.play{background:#e2c0fa;color:#32223f;border-radius:50%;height:48px;width:48px;display:grid;place-items:center;flex-shrink:0}.play svg{fill:currentColor;stroke-width:0}.actions{display:flex;gap:9px;margin:18px 0 2px}.chip{display:flex;gap:7px;align-items:center;justify-content:center;background:#302737;border-radius:18px;padding:12px 15px;font-size:12px;flex:1}.chip svg{width:17px;height:17px}.shelf{display:flex;gap:13px;overflow:auto;margin-right:-20px;padding-right:20px;scrollbar-width:none}.album{background:none;text-align:left;padding:0;min-width:139px;width:139px}.album b{display:block;font-size:13px;font-weight:550;margin-top:10px}.album small{display:block;font-size:11px;color:#a99dae;margin-top:4px}.row{display:flex;align-items:center;gap:12px;background:none;text-align:left;padding:10px 0;width:100%}.row .art{width:53px;flex-shrink:0;border-radius:12px}.row .art:after,.quick .art:after,.mini .art:after{font-size:9px;letter-spacing:0}.row b{font-size:14px;display:block;font-weight:550}.row small{display:block;font-size:12px;color:#a99dae;margin-top:5px}.row>span:nth-child(2){flex:1}.row .more{color:#998ba1;font-size:20px}.tabs{display:flex;border-bottom:1px solid #362c3c;margin:0 0 14px;gap:22px}.tabs button{background:none;padding:8px 0 13px;color:#ab9db2;font-size:13px;border-bottom:3px solid transparent}.tabs button.active{color:#e5c4fc;border-color:#d4adee}.label{font-size:11px;letter-spacing:1.5px;color:#9f90a7;margin:24px 0 8px}.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick{padding:0;display:flex;align-items:center;gap:9px;background:#2c2432;border-radius:14px;text-align:left;overflow:hidden}.quick .art{width:52px;flex-shrink:0;border-radius:12px}.quick b{font-size:11px;font-weight:550;line-height:1.4;padding-right:4px}.mix{display:flex;align-items:center;gap:14px;background:#332841;padding:16px;border-radius:22px}.mix .art{width:83px;flex-shrink:0;transform:rotate(-7deg);border:3px solid #4e3b5e}.mix b{display:block;font-size:18px;line-height:1.2;margin:5px 0 7px}.mix small{font-size:11px;color:#c5b2d0}.mix .play{height:35px;width:35px}.mix .play svg{width:18px}.genre{display:flex;gap:8px;flex-wrap:wrap}.genre button{background:#2b2432;border:1px solid #46384e;padding:10px 16px;border-radius:14px;font-size:12px}.dock{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#151218 16%);padding:14px 10px 0}.mini{height:60px;background:#42364f;border-radius:19px;display:flex;align-items:center;gap:10px;padding:8px 10px}.mini .art{height:41px;width:41px;border-radius:50%;flex-shrink:0}.mini .now{flex:1;min-width:0}.mini b{display:block;font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.mini small{font-size:10px;color:#c7b7d2}.mini button{width:33px;height:33px;background:#564562;border-radius:50%;display:grid;place-items:center;padding:6px}.mini button.toggle{background:#dfbaf7;color:#3e2850}.mini svg{width:19px;height:19px}.nav{display:flex;justify-content:space-around;padding:13px 5px 8px}.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;background:none;color:#b9abbf;min-width:66px}.nav button:first-child{color:#ead1fb}.nav button:first-child svg{background:#40304e;box-sizing:content-box;padding:3px 15px;border-radius:20px;margin:-3px -15px}.gesture{height:4px;width:105px;border-radius:5px;background:#e9e2ed;margin:10px auto 8px}.notes{font-size:12px;color:#b4a6bd;line-height:1.7;margin:16px 5px 0}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#efe3f7;color:#302337;border:1px solid #fff9;border-radius:30px;padding:7px;box-shadow:0 8px 40px #0009;z-index:10;white-space:nowrap}.switcher button{background:#ddd0e7;color:#302337;border-radius:50%;width:35px;height:35px}.switcher span{font-size:13px;min-width:160px;text-align:center}.toast{position:absolute;bottom:155px;left:20px;right:20px;padding:12px;background:#e6d4f1;color:#2e2138;border-radius:15px;font-size:12px;z-index:5;text-align:center}.B .apphead{margin:8px 0 20px}.B .apphead h3{font-size:34px}.B .actions{margin-bottom:24px}.C .apphead h3{font-size:27px}.C .section{margin-top:26px}@media(min-width:1600px){.phone{height:940px}}@media(max-width:1050px){.boards{grid-template-columns:repeat(3,370px);overflow:auto;padding-bottom:20px}.workspace{padding:25px 22px 100px}.boards.single{grid-template-columns:minmax(0,410px)}}@media(max-width:500px){.workspace{padding:16px 0 100px}.mast{padding:0 18px;margin-bottom:18px}.mast h1{font-size:22px}.mast p{display:none}.mast .eyebrow{font-size:9px}.compare{font-size:11px;padding:9px 12px}.boards.single{display:block}.board>header{padding:0 18px}.phone{border-radius:0;border:0;height:calc(100dvh - 280px);min-height:480px}.notes{padding:0 18px}.boards:not(.single){grid-template-columns:repeat(3,350px);padding-left:18px;gap:20px}.boards:not(.single) .phone{border-radius:30px;height:778px}.switcher{bottom:12px}.scroll{padding-top:12px}.status{display:none}.scroll{height:100%}}@media(prefers-reduced-motion:no-preference){button{transition:filter .15s}.board{animation:appear .2s ease-out}@keyframes appear{from{opacity:.5}to{opacity:1}}}
.D .apphead{margin-bottom:19px}.D .apphead h3{font-size:27px}.D .actions{margin-top:16px;margin-bottom:0}.D .chip{min-height:46px}.D .chip:first-child{background:#dfbaf7;color:#362144}.D .mix{min-height:130px}.D .mix>div{flex:1;min-width:0}.D .mix .play{width:40px;height:40px}.D .mix small{font-size:10px}.boards:not(.single){grid-template-columns:repeat(4,minmax(320px,1fr));overflow:auto;padding-bottom:18px}@media(max-width:500px){.boards:not(.single){grid-template-columns:repeat(4,350px)}}
</style></head><body><main class="workspace"><header class="mast"><div><div class="eyebrow">Aurelia / Android / design study 01</div><h1>A home worth coming back to.</h1><p>Try the new D: one mix, instant play, room to browse.</p></div><button class="compare" id="compare">Compare all four</button></header><div id="boards" class="boards"></div></main><nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous design">←</button><span id="variantLabel"></span><button id="next" aria-label="Next design">→</button></nav>
<script>
const songs=[['CHANEL','Tyla','#614132','#f0c2a6','CHANEL'],['Imaginal Disk','Magdalena Bay','#33434b','#bce2cf','imaginal disk'],['BRAT','Charli xcx','#a3be43','#243011','brat'],['Blonde','Frank Ocean','#656454','#ede8c6','blond'],['SOS','SZA','#163b55','#9fc5db','S O S'],['Charm','Clairo','#583339','#f0c0b2','Charm']];
const paths={play:'M8 5v14l11-7z',pause:'M8 5v14M16 5v14',next:'M5 5l10 7-10 7zM19 5v14',previous:'M19 5L9 12l10 7zM5 5v14',home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',search:'M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',library:'M4 4v16M9 4v16M14 4l6 15',shuffle:'M3 6h3c5 0 6 12 11 12h4M17 14l4 4-4 4M3 18h3c2 0 3-2 4-4M14 8c1-2 2-2 3-2h4M17 2l4 4-4 4',spark:'M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.play}"/></svg>`;
const art=i=>`<span class="art i${i}" style="--bg:${songs[i][2]};--ink:${songs[i][3]}" data-word="${songs[i][4]}" aria-hidden="true"></span>`;
const play=i=>`<button class="play" data-play="${i}" aria-label="Play ${songs[i][0]}">${icon('play')}</button>`;
const row=i=>`<button class="row" data-play="${i}">${art(i)}<span><b>${songs[i][0]}</b><small>${songs[i][1]}</small></span><span class="more">▷</span></button>`;
const shelf=ids=>`<div class="shelf">${ids.map(i=>`<button class="album" data-play="${i}">${art(i)}<b>${songs[i][0]}</b><small>${songs[i][1]}</small></button>`).join('')}</div>`;
const section=(name,more=false)=>`<div class="section"><h4>${name}</h4>${more?'<button data-more="'+name+'">See all →</button>':''}</div>`;
const actions=()=>`<div class="actions"><button class="chip" data-shuffle>${icon('shuffle')}Shuffle library</button><button class="chip" data-surprise>${icon('spark')}Surprise me</button></div>`;
const quick=()=>`<div class="quickgrid">${[0,1,2,3,4,5].map(i=>`<button class="quick" data-play="${i}">${art(i)}<b>${songs[i][0]}</b></button>`).join('')}</div>`;
const genres=()=>section('A little of everything')+`<div class="genre">${['R&B','Pop','Indie','Electronic'].map(x=>`<button data-genre="${x}">${x}</button>`).join('')}</div>`;
const head=(greeting,title)=>`<div class="apphead"><div>${greeting?`<div class="subtle">${greeting}</div>`:''}<h3>${title}</h3></div><div class="avatar" aria-label="Profile">M</div></div>`;
const variants={
A:{name:'In the spotlight',tag:'Artwork first. One clear place to start.',note:'One album gets the room to breathe. Fewer competing choices above the fold; more browsing as you scroll.',render:()=>head('Friday, September 4','Good evening, Mars')+`<div class="hero">${art(0)}<div class="herofoot"><div><div class="eyebrow">Back in your rotation</div><h4>CHANEL</h4><p>Tyla · Pick up where you left off</p></div>${play(0)}</div></div>`+actions()+section('Stay a little longer',true)+shelf([1,3,5])+section('New to your library',true)+shelf([2,4,0])+genres()},
B:{name:'On repeat',tag:'Your listening, a thumb’s reach away.',note:'A compact, song-first home. History and favorites share one space, with less decoration and more immediately playable music.',render:()=>head('Your music, ready when you are.','Home')+actions()+`<div class="tabs" role="tablist" aria-label="Music selection"><button role="tab" aria-selected="true" class="active" data-tab="Recent">Recent</button><button role="tab" aria-selected="false" data-tab="Favorites">Favorites</button><button role="tab" aria-selected="false" data-tab="Rediscover">Rediscover</button></div><div class="songlist"><div class="label">BACK IN ROTATION</div>${[0,1,2,4].map(row).join('')}<div class="label">A LITTLE EARLIER</div>${[3,5].map(row).join('')}</div>`+section('New on your shelf',true)+shelf([1,5,2])+genres()},
C:{name:'A little of both',tag:'Familiar favorites, with room to wander.',note:'Quick picks lead straight to playback. A single mix breaks up the grid, then new albums invite you to explore.',render:()=>head('Good evening, Mars','What sounds good?')+quick()+section('Let it play')+`<div class="mix">${art(4)}<div><small>BASED ON YOUR LISTENING</small><b>A little more SZA</b><small>SZA, Tyla, Frank Ocean</small></div>${play(4)}</div>`+section('Fresh on your shelf',true)+shelf([1,5,2])+section('Worth another listen',true)+[3,4,0].map(row).join('')+actions()+genres()},
D:{name:'Press play, settle in',tag:'A mix to start. Shuffle or surprise right below.',note:'The featured mix leads, with shuffle and surprise underneath. Albums and song rows follow for a little browsing.',render:()=>head('Good evening, Mars','What sounds good?')+section('Let it play')+`<div class="mix">${art(4)}<div><small>BASED ON YOUR LISTENING</small><b>A little more SZA</b><small>SZA, Tyla, Frank Ocean</small></div>${play(4)}</div>`+actions()+section('Fresh on your shelf',true)+shelf([1,5,2])+section('Worth another listen',true)+[3,4,0].map(row).join('')+genres()}
};
let selected=0,playing=false;const keys=['A','B','C','D'];let variant=new URL(location.href).searchParams.get('variant')||'D';if(![...keys,'all'].includes(variant))variant='D';
function mini(){return `<div class="mini">${art(selected)}<div class="now"><b>${songs[selected][0]}</b><small>${songs[selected][1]}</small></div><button data-skip="-1" aria-label="Previous">${icon('previous')}</button><button class="toggle" data-toggle aria-label="${playing?'Pause':'Play'}">${icon(playing?'pause':'play')}</button><button data-skip="1" aria-label="Next">${icon('next')}</button></div>`}
function board(k){const v=variants[k];return `<article class="board ${k}"><header><span class="letter">${k}</span><div><h2>${v.name}</h2><p>${v.tag}</p></div></header><div class="phone"><div class="status"><span>9:41</span><i class="camera"></i><span>▴ ≋ ▰</span></div><div class="scroll">${v.render()}</div><div class="dock">${mini()}<nav class="nav" aria-label="App navigation"><button data-nav="Home">${icon('home')}Home</button><button data-nav="Search">${icon('search')}Search</button><button data-nav="Library">${icon('library')}Library</button></nav><div class="gesture"></div></div></div><p class="notes">${v.note}</p></article>`}
function render(){document.getElementById('boards').className='boards'+(variant==='all'?'':' single');document.getElementById('boards').innerHTML=(variant==='all'?keys:[variant]).map(board).join('');document.getElementById('variantLabel').textContent=variant==='all'?'All four directions':variant+' · '+variants[variant].name;document.getElementById('compare').textContent=variant==='all'?'Focus on D':'Compare all four';console.info('Prototype state',{variant,selected:songs[selected][0],playing,sampleData:true});}
function choose(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
function cycle(d){choose(keys[(Math.max(0,keys.indexOf(variant))+d+keys.length)%keys.length])}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('compare').onclick=()=>choose(variant==='all'?'D':'all');
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable],.shelf,[role=tablist]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
function updatePlayer(){document.querySelectorAll('.mini').forEach(el=>{el.outerHTML=mini()})}
function toast(el,message){const p=el.closest('.phone');p.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=message;p.append(t);setTimeout(()=>t.remove(),2500)}
document.getElementById('boards').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-play')){selected=+b.dataset.play;playing=true;updatePlayer()}else if(b.hasAttribute('data-toggle')){playing=!playing;updatePlayer()}else if(b.hasAttribute('data-skip')){selected=(selected+Number(b.dataset.skip)+songs.length)%songs.length;updatePlayer()}else if(b.hasAttribute('data-shuffle')||b.hasAttribute('data-surprise')||b.hasAttribute('data-genre')){selected=(selected+1+Math.floor(Math.random()*5))%6;playing=true;updatePlayer();toast(b,'Sample selection · '+songs[selected][0])}else if(b.dataset.tab){b.parentElement.querySelectorAll('button').forEach(t=>{t.classList.toggle('active',t===b);t.setAttribute('aria-selected',String(t===b))});const ids=b.dataset.tab==='Favorites'?[4,3,0]:b.dataset.tab==='Rediscover'?[5,2,1]:[0,1,2,4,3,5];b.closest('.scroll').querySelector('.songlist').innerHTML='<div class="label">'+b.dataset.tab.toUpperCase()+'</div>'+ids.map(row).join('')}else if(b.dataset.more){toast(b,b.dataset.more+' · full collection would open here')}else if(b.dataset.nav){toast(b,b.dataset.nav==='Home'?'You’re home':b.dataset.nav+' is outside this home-screen study')}};
render();
</script></body></html>
