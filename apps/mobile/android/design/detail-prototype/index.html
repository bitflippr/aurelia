<header class="board"><div class="brand">aurelia<span>Android / Detail studies</span></div><div class="boardtools"><button id="theme" aria-pressed="false">Light theme</button><button id="artwork" aria-pressed="false">Missing artwork</button></div></header>
<main class="workspace"><aside class="editorial"><div class="eyebrow">Design exploration · <span id="variant-key"></span></div><h1 id="heading"></h1><p class="intro" id="intro"></p><div class="decision" id="decision"></div><div class="state" id="state" aria-live="polite"></div></aside><div class="screens"><section><div class="screen-label"><b>01 / Artist</b><span>390 × 844</span></div><div id="artist" class="phone"></div></section><section><div class="screen-label"><b>02 / Album</b><span>390 × 844</span></div><div id="album" class="phone"></div></section></div></main>

<script>
const paths={back:'m15 5-7 7 7 7M8 12h13',play:'m9 5 11 7-11 7Z',pause:'M9 5v14M15 5v14',next:'m6 5 10 7-10 7ZM19 5v14',previous:'m18 5-10 7 10 7ZM5 5v14',shuffle:'M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 3-2 4-4m4-4c1-2 2-4 4-4h3m-4-4 4 4-4 4',more:'M12 4h.01M12 12h.01M12 20h.01',chevron:'m9 5 7 7-7 7',home:'m3 10 9-7 9 7v10h-6v-7H9v7H3Z',search:'M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',library:'M4 4v16M8 4v16m5-15 5-1 4 15-5 1Z',signal:'M4 19V15M9 19V11M14 19V7M19 19V3',battery:'M3 6h16v12H3ZM22 10v4',waves:'M4 10v4M8 5v14M12 8v8M16 3v18M20 9v6'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.play}"/></svg>`;
const ib=(name,label,act)=>`<button class="iconbtn" aria-label="${label}" data-action="${act}">${icon(name)}</button>`;
const albums=['Blue Hour','Soft Focus','Still / Moving'];
const songs=['First Light','Blue Hour','Somewhere, Slowly','Stay a Little Longer','Afterglow','Between the Waves','Home Again','Last Light'];
const times=['3:42','4:18','3:56','5:02','4:11','3:38','4:47','3:52'];
let variant=['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';
let selectedTab='Albums',playing=true,current=1,missing=false,light=false,expandedSongs=false;
const configs={A:{title:'Let the music\nset the scene.',intro:'An immersive artist header and a generous album cover. Soft artwork color flows into the same rounded controls and quiet surfaces as the player.',notes:'<strong>Artwork first</strong><p>A full-width artist image establishes identity. Albums sit on a horizontal shelf, like the home page.</p><strong>One clear path</strong><p>Play and shuffle stay together. Songs follow the albums; biography moves below the music.</p><strong>The tradeoff</strong><p>The strongest visual identity, with fewer songs visible before scrolling.</p>'},B:{title:'Closer to\nthe catalog.',intro:'Compact identities put more music within reach. Artist tabs separate albums, songs, and biography; the album header shares a row with its artwork.',notes:'<strong>Music first</strong><p>Large album rows are easy to scan and tap. A compact album header brings five or more tracks above the miniplayer.</p><strong>Less repetition</strong><p>Albums and songs have their own views. The artist page no longer repeats the full catalog below an introductory list.</p><strong>The tradeoff</strong><p>Efficient for a large library, but less immersive. Tabs add one tap to change context.</p>'},C:{title:'A softer place\nto press play.',intro:'Contained, expressive cards extend the home page’s visual language. A listening card gives album identity and playback a shared home.',notes:'<strong>A familiar rhythm</strong><p>Rounded surfaces, an offset cover, and a compact album spotlight echo the refreshed home page.</p><strong>Grouped by purpose</strong><p>Identity and playback live together. The track list gets a separate, calm surface.</p><strong>The tradeoff</strong><p>Approachable and cohesive, with more containers and less room for long titles.</p>'}};
function art(i=0,extra=''){return `<span class="art ${i===1?'alt':i===2?'third':''} ${extra}">${i===0?'<img src="assets/album.jpg" alt="Pastel ocean sunset album artwork">':''}<span class="cover-title">${['BLUE HOUR','SOFT FOCUS','STILL / MOVING'][i]}</span></span>`}
function actions(){return `<div class="actions"><button data-action="play">${icon('play')}Play</button><button data-action="shuffle">${icon('shuffle')}Shuffle</button><button class="more" aria-label="More actions" data-action="menu">${icon('more')}</button></div>`}
function topbar(label){return `<div class="topbar">${ib('back','Back','back')}<span>${label}</span><span style="width:44px"></span></div>`}
function status(){return `<div class="statusbar"><span>9:41</span><div class="status-icons">${icon('signal')}${icon('battery')}</div></div>`}
function dock(){return `<div class="dock"><div class="mini">${art()}<div class="mini-text"><strong>${songs[current]}</strong><small>Sora Vale</small></div><div class="mini-controls">${ib('previous','Previous track','previous')}<button class="iconbtn pause" aria-label="${playing?'Pause':'Play'} current track" data-action="pause">${icon(playing?'pause':'play')}</button>${ib('next','Next track','next')}</div></div><div class="nav"><div class="nav-item"><div>${icon('home')}</div>Home</div><div class="nav-item"><div>${icon('search')}</div>Search</div><div class="nav-item active"><div>${icon('library')}</div>Library</div></div><div class="gesture"></div></div>`}
function tracks(count=8,thumb=false){return Array.from({length:count},(_,i)=>`<div class="track ${current===i?'current':''}"><button class="track-main" data-track="${i}" aria-label="Play ${songs[i]}">${thumb?art():`<span class="number">${current===i&&playing?icon('waves'):i+1}</span>`}<span class="tracktext"><strong>${songs[i]}</strong>${thumb?'<small>Blue Hour</small>':''}</span><span class="time">${times[i]}</span></button>${ib('more',`More options for ${songs[i]}`,`trackmenu-${i}`)}</div>`).join('')}
function shelf(){return `<div class="shelf">${albums.map((a,i)=>`<button class="albumcard" data-album="${i}">${art(i)}<strong>${a}</strong><small>${[8,10,9][i]} songs</small></button>`).join('')}</div>`}
const sh=(title,action='',act='songs')=>`<div class="sectionhead"><h2>${title}</h2>${action?`<button data-action="${act}">${action}</button>`:''}</div>`;
function about(){return `<div class="about">Sora Vale makes quietly expansive songs, pairing intimate vocals with warm electronics and slow-moving guitars.<br><br>From the soft edges of <em>Soft Focus</em> to the open spaces of <em>Blue Hour</em>, the music finds its home somewhere between the familiar and the far away.</div>`}
function artistContent(){const hero=`<div class="hero"><img class="artist-photo" src="assets/artist.jpg" alt="Microphone on a softly lit stage"><span class="artist-fallback" aria-hidden="true">SV</span><div class="identity"><h2 class="title">Sora Vale</h2><div class="meta">3 albums · 27 songs · 1h 52m</div></div></div>`;
if(variant==='B')return `${topbar('Artist')}${hero}<div class="content">${actions()}<div class="tabs" role="tablist">${['Albums','Songs','About'].map(t=>`<button role="tab" aria-selected="${selectedTab===t}" class="${selectedTab===t?'selected':''}" data-tab="${t}">${t}</button>`).join('')}</div>${selectedTab==='Albums'?albums.map((a,i)=>`<button class="album-list" data-album="${i}">${art(i)}<div><strong>${a}</strong><small>${[8,10,9][i]} songs · ${[33,41,38][i]} min</small></div>${icon('chevron')}</button>`).join(''):selectedTab==='Songs'?tracks(8,true):about()}</div>`;
if(variant==='C')return `${topbar('Artist')}${hero}<div class="content">${actions()}${sh('From your library')}<button class="feature" data-album="0">${art()}<div><small>ALBUM SPOTLIGHT</small><strong>Blue Hour</strong><small>8 songs · 33 min</small></div>${icon('chevron')}</button>${sh('Songs','View all')}${tracks(expandedSongs?8:3,true)}${sh('Albums')}${shelf()}${sh('About Sora Vale')}${about()}</div>`;
return `${topbar('')}${hero}<div class="content">${actions()}${sh('Albums','View all','albums')}${shelf()}${sh('Songs','View all')}${tracks(expandedSongs?8:4,true)}${sh('About Sora Vale')}${about()}</div>`}
function albumContent(){const identity=`<div><h2 class="title">Blue Hour</h2><button class="artist-link" data-action="artist">Sora Vale ${icon('chevron')}</button><div class="meta">Album · 8 songs · 33 min</div></div>`;return `${topbar('Album')}<div class="album-hero"><div class="content">${variant==='B'?`<div class="album-identity">${art(0,'cover-large')}${identity}</div>`:`${art(0,'cover-large')}<div class="album-identity">${identity}</div>`}${actions()}</div></div><div class="content">${sh('Tracks','8 songs','trackinfo')}<div class="tracklist">${tracks()}</div><p class="meta" style="margin-top:24px">8 songs · 33 min<br>From your Jellyfin library</p></div>`}
function render(keep=false){const positions=[...document.querySelectorAll('.scroll')].map(x=>x.scrollTop);document.body.classList.toggle('light',light);document.body.classList.toggle('empty-art',missing);document.querySelector('#theme').setAttribute('aria-pressed',light);document.querySelector('#artwork').setAttribute('aria-pressed',missing);for(const name of ['artist','album']){const phone=document.querySelector('#'+name);phone.className=`phone ${variant} ${name}`;phone.innerHTML=status()+`<div class="scroll" tabindex="0" aria-label="${name} page">${name==='artist'?artistContent():albumContent()}</div>`+dock()};if(keep)document.querySelectorAll('.scroll').forEach((x,i)=>x.scrollTop=positions[i]);document.querySelector('#variant-key').textContent=variant+' / 03';document.querySelector('#heading').innerHTML=configs[variant].title.replace('\n','<br>');document.querySelector('#intro').textContent=configs[variant].intro;document.querySelector('#decision').innerHTML=configs[variant].notes;document.querySelector('#state').innerHTML=`THROWAWAY MOCKUP · FICTIONAL LIBRARY<br>${light?'Light':'Dark'} theme · ${missing?'Artwork unavailable':'Artwork present'}<br>${playing?'Playing':'Paused'}: ${songs[current]}<br>Artist view: ${variant==='B'?selectedTab:'Overview'}<br>Scroll either phone to explore.`;document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('chosen',b.dataset.variant===variant);b.setAttribute('aria-pressed',b.dataset.variant===variant)});}
function switchVariant(v){variant=v;const u=new URL(location);u.searchParams.set('variant',v);history.replaceState({},'',u);render()}
function notify(phone,msg){phone.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;phone.append(t);setTimeout(()=>t.remove(),2400)}
function menu(phone,title){const layer=document.createElement('div');layer.className='sheet';layer.innerHTML=`<div role="dialog" aria-label="${title}"><h3>${title}</h3><button data-action="queue">Add to queue</button><button data-action="playnext">Play next</button><button data-action="playlist">Add to playlist</button><button data-action="close">Close</button></div>`;phone.append(layer);layer.querySelector('button').focus();layer.addEventListener('click',e=>{if(e.target===layer)layer.remove()})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.closest('.phone');if(b.dataset.variant)return switchVariant(b.dataset.variant);if(b.dataset.step)return switchVariant(['A','B','C'][( ['A','B','C'].indexOf(variant)+Number(b.dataset.step)+3)%3]);if(b.id==='theme'){light=!light;return render(true)}if(b.id==='artwork'){missing=!missing;return render(true)}if(b.dataset.tab){selectedTab=b.dataset.tab;return render(true)}if(b.dataset.track!==undefined){current=Number(b.dataset.track);playing=true;return render(true)}if(b.dataset.album!==undefined){if(b.dataset.album==='0'){document.querySelector('#album .scroll').scrollTop=0;document.querySelector('#album').scrollIntoView({behavior:'smooth',block:'center'});notify(document.querySelector('#album'),'Blue Hour opened')}else notify(p,albums[b.dataset.album]+' · illustrative album');return}const a=b.dataset.action;if(a==='play'||a==='shuffle'){current=a==='shuffle'?4:0;playing=true;render(true);notify(document.querySelector('#'+p.id),a==='shuffle'?'Shuffled playback · mock queue':'Playing from the beginning · mock queue')}else if(a==='pause'){playing=!playing;render(true)}else if(a==='next'||a==='previous'){current=(current+(a==='next'?1:7))%8;render(true)}else if(a==='menu'||a?.startsWith('trackmenu-'))menu(p,a==='menu'?(p.id==='artist'?'Sora Vale':'Blue Hour'):songs[Number(a.split('-')[1])]);else if(['queue','playnext','playlist','close'].includes(a)){p.querySelector('.sheet')?.remove();if(a!=='close')notify(p,({queue:'Added to mock queue',playnext:'Playing next in mock queue',playlist:'Playlist picker would open here'})[a])}else if(a==='artist'){document.querySelector('#artist .scroll').scrollTop=0;document.querySelector('#artist').scrollIntoView({behavior:'smooth',block:'center'})}else if(a==='songs'){expandedSongs=true;render(true);notify(document.querySelector('#artist'),'Showing all sample songs')}else if(a==='albums'){const shelf=p.querySelector('.shelf');if(shelf)shelf.scrollTo({left:shelf.scrollWidth,behavior:'smooth'});notify(p,'3 albums · swipe the shelf to browse')}else if(a==='back')notify(p,'Returns to the previous page in the app');else if(a==='trackinfo')notify(p,'8 tracks, in album order')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.sheet').forEach(x=>x.remove());if(e.target.closest('input,textarea,[contenteditable],.scroll'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+(e.key==='ArrowRight'?1:2))%3])}});render();
</script></body></html>
