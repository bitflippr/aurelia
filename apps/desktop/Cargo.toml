[package]
name = "aurelia-desktop"
version = "0.1.0"
edition = "2024"
publish = false

# The desktop runtime: session, library, playback and artwork. The window and
# interface are GPUIX (`ui/`); `native/aurelia.rs` connects the two.
[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
aurelia-core = { path = "../../crates/aurelia-core", features = ["desktop"] }
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.19", features = ["v4"] }
