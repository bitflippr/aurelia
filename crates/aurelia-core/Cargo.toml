[package]
name = "aurelia-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "aurelia_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
desktop = [
  "dep:biquad",
  "dep:rodio",
  "dep:rustfft",
  "dep:souvlaki",
  "dep:stream-download",
  "dep:windows-sys",
]

[dependencies]
aurelia-lyrics = { path = "../aurelia-lyrics", features = ["uniffi"] }
anyhow = "1.0"

chrono = { version = "0.4.38", features = ["serde"] }
dirs = "6.0"
once_cell = "1.21.3"
postcard = { version = "1.0", features = ["use-std"] }
rand = "0.10"
regex = "1.11"
redb = "3.1"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
tracing = "0.1"
urlencoding = "2.1"
uuid = { version = "1.19", features = ["v4"] }
tokio = { version = "1.43", features = ["rt-multi-thread"] }
uniffi = { version = "0.31.0", features = ["tokio"] }
unicode-normalization = "0.1"

biquad = { version = "0.5.0", optional = true }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-all"], optional = true }
rustfft = { version = "6.2", optional = true }
souvlaki = { git = "https://github.com/skulldogged/souvlaki", rev = "7ddcc88272ffec6e327d3483e4be0797945178ca", optional = true }
stream-download = { version = "0.22", features = ["reqwest-rustls"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
httpmock = "0.8"
tempfile = "3.12"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
